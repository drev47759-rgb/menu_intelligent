name: Créer branche pre-migration

on:
  push:
    branches: [develop]
    paths: ['.github/workflows/create-premigration-branch.yml']

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Créer la branche pre-migration sur le commit pré-migration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref=refs/heads/pre-migration \
            -f sha=50f61109a0a7097d23ade66330273def3c97bf5c
          code=$?
          if [ "$code" != "0" ]; then
            echo "POST ref: exit $code — vérification de l'existence"
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/pre-migration" >/dev/null 2>&1 \
              && echo "OK : branche déjà présente" \
              || { echo "Échec création"; exit 1; }
          fi
