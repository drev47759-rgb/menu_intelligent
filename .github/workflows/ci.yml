name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: |
          set +e
          npm run lint > lint-output.txt 2>&1
          code=$?
          echo "lint_exit=$code" >> "$GITHUB_ENV"
          exit 0
      - name: Typecheck
        run: |
          set +e
          npm run typecheck > typecheck-output.txt 2>&1
          code=$?
          echo "typecheck_exit=$code" >> "$GITHUB_ENV"
          exit 0
      - name: Build
        run: |
          set +e
          npm run build > build-output.txt 2>&1
          code=$?
          echo "build_exit=$code" >> "$GITHUB_ENV"
          exit 0
      - name: Audit
        run: |
          set +e
          npm audit --omit=dev --audit-level=critical > audit-output.txt 2>&1
          code=$?
          echo "audit_exit=$code" >> "$GITHUB_ENV"
          exit 0
      - name: Résultat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          failed=0
          : > ci-report.md
          for step in lint typecheck build audit; do
            code_var="${step}_exit"
            code="${!code_var}"
            {
              echo "## ${step} : exit ${code}"
              echo
            } >> ci-report.md
            if [ "$code" != "0" ]; then
              failed=1
              {
                echo '```'
                tail -n 120 "${step}-output.txt"
                echo '```'
                echo
              } >> ci-report.md
            fi
          done
          if [ "$failed" = "1" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Rapport CI — échec" --body-file ci-report.md || true
            exit 1
          fi
