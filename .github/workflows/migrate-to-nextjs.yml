name: Migration vers Next.js

on:
  push:
    branches: [migration-nextjs]

permissions:
  contents: write
  issues: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historique complet)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurer git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/drev47759-rgb/menu_intelligent.git"

      - name: Retirer les fichiers Vite / TanStack Start
        run: |
          git rm -r -q --ignore-unmatch \
            src/routes src/router.tsx src/routeTree.gen.ts src/styles.css \
            src/components/preview-host-bridge.tsx \
            src/lib/app-data src/lib/auth src/lib/multiplayer src/lib/og \
            src/lib/db.ts src/lib/env.server.ts src/lib/error-component.tsx \
            src/lib/preview-host-bridge.ts src/lib/preview-embedder-origin.ts \
            vite.config.ts package-lock.json .node_modules.lock .project_id \
            startup.sh server migrations .grok .vercel public/__grok AGENTS.md \
            .github/workflows/migrate-to-nextjs.yml
          if [ -d scripts ]; then
            find scripts -type f ! -name 'extract-menus.py' -delete
            git add -A scripts
          fi

      - name: Garde-fou (aucune référence TanStack / Vite restante)
        run: >
          ! grep -rn -E "import\.meta\.env|@tanstack|better-auth|pglite|@vitejs" src/
          --include="*.ts" --include="*.tsx"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Versions (diagnostic)
        run: >
          npm ls eslint typescript eslint-config-next typescript-eslint 2>&1 | tee versions.txt || true

      - name: TypeScript
        continue-on-error: true
        run: npx tsc --noEmit 2>&1 | tee tsc-out.txt || touch failed.flag

      - name: ESLint
        continue-on-error: true
        run: npm run lint 2>&1 | tee lint-out.txt || touch failed.flag

      - name: Build Next.js
        continue-on-error: true
        run: npm run build 2>&1 | tee build-out.txt || touch failed.flag

      - name: Vérifier le statut global
        run: |
          if [ -f failed.flag ]; then
            echo "Au moins une étape a échoué — publication du diagnostic."
            exit 1
          fi

      - name: Publier sur develop et supprimer la branche temporaire
        run: |
          rm -f tsc-out.txt lint-out.txt build-out.txt versions.txt failed.flag
          git add -A
          git commit -m "Migration vers Next.js 16 — App Router, Tailwind v4, optimisé Vercel"
          git push origin HEAD:develop
          git push origin --delete migration-nextjs

      - name: Diagnostic (échec)
        if: failure()
        run: |
          {
            echo "Échec de la migration Next.js sur migration-nextjs — sorties brutes des étapes."
            echo
            echo "### Versions"
            echo '~~~'
            cat versions.txt 2>/dev/null || true
            echo '~~~'
            echo "### TypeScript"
            echo '~~~'
            cat tsc-out.txt 2>/dev/null || true
            echo '~~~'
            echo "### ESLint"
            echo '~~~'
            cat lint-out.txt 2>/dev/null || true
            echo '~~~'
            echo "### Build (fin)"
            echo '~~~'
            tail -n 120 build-out.txt 2>/dev/null || true
            echo '~~~'
          } > issue-body.md
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Migration Next.js : diagnostic d'échec" \
            --body-file issue-body.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
